<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Analytics</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:11px;color:#697784;text-transform:uppercase}.v{font-size:30px;font-weight:800;margin-top:7px}.sub{font-size:13px;color:#697784;margin-top:5px}button{height:40px;padding:0 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{gap:8px}.v{font-size:25px}}</style></head><body><main><div class="top"><div><h1>Executive Analytics</h1><div>Live workforce, recruiting, approvals, performance and attendance indicators</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Total Employees</div><div class="v" id="total">—</div><div class="sub" id="active">Active —</div></div><div class="card"><div class="k">Open Jobs</div><div class="v" id="jobs">—</div></div><div class="card"><div class="k">Pending Approvals</div><div class="v" id="approvals">—</div><div class="sub" id="overdue">Overdue —</div></div><div class="card"><div class="k">Pending Reviews</div><div class="v" id="reviews">—</div></div><div class="card"><div class="k">Pending Leave</div><div class="v" id="leave">—</div></div><div class="card"><div class="k">Generated</div><div class="v" style="font-size:18px" id="generated">—</div></div></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';async function load(){const r=await fetch('/api/v1/analytics/executive',{headers:{Authorization:'Bearer '+token}});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';return}if(!r.ok){document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Analytics data unavailable</p>');return}const d=await r.json();total.textContent=d.people?.total??0;active.textContent='Active '+(d.people?.active??0);jobs.textContent=d.recruiting?.open_jobs??0;approvals.textContent=d.approvals?.pending_approvals??0;overdue.textContent='Overdue '+(d.approvals?.overdue_approvals??0);reviews.textContent=d.performance?.pending_reviews??0;leave.textContent=d.attendance?.pending_leave??0;generated.textContent=d.generated_at?new Date(d.generated_at).toLocaleString():'—'}load()</script></body></html>
