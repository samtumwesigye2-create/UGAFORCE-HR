<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Approvals</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:11px;color:#697784;text-transform:uppercase}.v{font-size:29px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button{height:38px;padding:0 12px;border:1px solid #d5dde4;border-radius:9px;background:#fff}.danger{color:#a33}.actions{display:flex;gap:6px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><h1>Approval Center</h1><div>Central manager and HR approval inbox</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Pending</div><div class="v" id="pending">—</div></div><div class="card"><div class="k">Overdue</div><div class="v" id="overdue">—</div></div><div class="card"><div class="k">Current Inbox</div><div class="v" id="visible">—</div></div></div><div class="card tablewrap"><h2>Pending Approvals</h2><table><thead><tr><th>Workflow</th><th>Resource</th><th>Step</th><th>Approver Role</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function req(u,o={}){const r=await fetch('/api/v1'+u,{...o,headers:{...H,...(o.headers||{})}});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}async function decide(id,action){await req('/approvals/'+id+'/decision',{method:'POST',body:JSON.stringify({action})});load()}async function load(){try{let d=await req('/approvals/inbox?status=pending');pending.textContent=d.count;visible.textContent=d.count;overdue.textContent=(d.results||[]).filter(x=>x.overdue).length;rows.innerHTML=(d.results||[]).map(x=>`<tr><td>${x.workflow||'—'}</td><td>${x.resource_type||''} · ${x.resource_id||''}</td><td>${x.current_step||''}</td><td>${x.approver_role||'—'}</td><td class="${x.overdue?'danger':''}">${x.due_at?new Date(x.due_at).toLocaleString():'—'}</td><td>${x.overdue?'OVERDUE':x.status||''}</td><td><div class="actions"><button onclick="decide('${x.id}','approve')">Approve</button><button onclick="decide('${x.id}','reject')">Reject</button></div></td></tr>`).join('')||'<tr><td colspan="7">No pending approvals</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="7">Approval inbox unavailable</td></tr>'}}load()</script></body></html>
