<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Time & Attendance</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:12px;color:#697784;text-transform:uppercase}.v{font-size:30px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button{padding:10px 13px;border:1px solid #d5dde4;border-radius:9px;background:white}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.v{font-size:25px}}</style></head><body><main><div class="top"><div><h1>Time, Attendance & Leave</h1><div>Live attendance, timesheets and leave operations</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Clocked In Now</div><div class="v" id="a">—</div></div><div class="card"><div class="k">Entries Today</div><div class="v" id="e">—</div></div><div class="card"><div class="k">Leave Pending</div><div class="v" id="l">—</div></div><div class="card"><div class="k">Timesheets Pending</div><div class="v" id="t">—</div></div></div><div class="card tablewrap"><h2>Attendance</h2><table><thead><tr><th>Employee</th><th>Clock In</th><th>Clock Out</th><th>Hours</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={Authorization:'Bearer '+token};async function get(u){const r=await fetch('/api/v1'+u,{headers:H});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}if(!r.ok)throw Error('Request failed');return r.json()}async function load(){try{const m=await get('/time/metrics');a.textContent=m.clocked_in_now;e.textContent=m.entries_today;l.textContent=m.leave_pending;t.textContent=m.timesheets_pending;const x=await get('/time/attendance');rows.innerHTML=(x.results||[]).map(v=>`<tr><td>${v.employee_number||''} ${v.first_name||''} ${v.last_name||''}</td><td>${v.clock_in?new Date(v.clock_in).toLocaleTimeString():'—'}</td><td>${v.clock_out?new Date(v.clock_out).toLocaleTimeString():'—'}</td><td>${v.hours??'—'}</td><td>${v.status||''}</td></tr>`).join('')||'<tr><td colspan="5">No attendance entries</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="5">Attendance data unavailable</td></tr>'}}load()</script></body></html>
