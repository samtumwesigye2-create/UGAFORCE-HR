<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAFORCE-HR People</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f3f5f7;color:#111b27}main{max-width:1100px;margin:auto;padding:22px 22px 105px}.hero{background:linear-gradient(145deg,#071a26,#123443);color:#fff;border-radius:0 0 30px 30px;padding:28px;margin:-22px -22px 22px}.brand{font-size:13px;letter-spacing:2px;color:#b9cad3}.hero h1{font-size:36px;margin:14px 0 5px}.muted{color:#71808d;font-size:14px}.hero .muted{color:#bdcbd2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.stat{padding:14px;border:1px solid #35515e;border-radius:16px;background:#ffffff0c}.stat b{display:block;font-size:25px}.stat span{font-size:10px;letter-spacing:1px;color:#b9cad3;text-transform:uppercase}.card{background:#fff;border:1px solid #dde3e7;border-radius:18px;padding:16px;margin-top:15px;box-shadow:0 4px 12px #16232d0b}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{flex:1;min-width:190px}input,select,button{font:inherit;padding:12px;border:1px solid #d4dde3;border-radius:11px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:#102d3b;color:#fff;border-color:#102d3b}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectiontitle h2{font-size:19px;margin:0}.employee{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid #edf0f2}.employee:last-child{border-bottom:0}.avatar{width:46px;height:46px;border-radius:14px;background:#e9f0f3;display:grid;place-items:center;font-weight:800;color:#294857}.name{font-weight:750}.meta{font-size:12px;color:#74818d;margin-top:3px}.badge{font-size:11px;padding:6px 8px;border-radius:20px;background:#edf7f1;color:#247049;text-transform:capitalize}.empty{text-align:center;padding:30px 10px;color:#71808d}.bottom{position:fixed;left:18px;right:18px;bottom:14px;max-width:670px;margin:auto;background:#fff;border:1px solid #e0e5e8;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:10px;box-shadow:0 10px 35px #0b172333}.bottom button{border:0;padding:8px 2px;font-size:11px;color:#6f7b86}.bottom .active{color:#12384a;background:#edf3f6}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid input,.formgrid select{width:100%}.wide{grid-column:1/-1}dialog{border:0;border-radius:22px;padding:0;width:min(620px,94vw);box-shadow:0 25px 70px #0005}dialog::backdrop{background:#07131c99}.modal{padding:22px}.modal h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:600px){main{padding:16px 16px 105px}.hero{margin:-16px -16px 18px;padding:25px 22px}.hero h1{font-size:31px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.employee{grid-template-columns:45px 1fr auto}}</style></head><body><main><section class="hero"><div class="brand">UGAFORCE-HR · PEOPLE</div><h1>Employee Directory</h1><div class="muted">Search, organize and manage workforce records.</div><div class="stats"><div class="stat"><b id="active">—</b><span>Active</span></div><div class="stat"><b id="departments">—</b><span>Departments</span></div><div class="stat"><b id="total">—</b><span>Records</span></div></div></section><div class="card"><div class="sectiontitle"><h2>People</h2><button class="primary" id="add">+ Add employee</button></div><div class="toolbar"><input id="q" placeholder="Search name, ID, email or title"><select id="status"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select><button id="refresh">Refresh</button></div></div><div class="card" id="list"><div class="empty">Loading employee directory…</div></div></main><nav class="bottom"><button onclick="location.href='/'">⌂<br>Home</button><button class="active">♟♟<br>People</button><button onclick="location.href='/approvals'">☑<br>Approvals</button><button onclick="location.href='/password'">U<br>Account</button></nav><dialog id="modal"><div class="modal"><h2>Add employee</h2><div class="formgrid"><input id="num" placeholder="Employee ID *"><input id="first" placeholder="First name *"><input id="last" placeholder="Last name *"><input id="email" type="email" placeholder="Work email"><input id="title" placeholder="Job title"><input id="hire" type="date"><select id="dept"><option value="">No department</option></select><select id="role"><option>EMPLOYEE</option><option>MANAGER</option><option>HR_SPECIALIST</option><option>HR_MANAGER</option><option>HR_ADMIN</option></select></div><div class="actions"><button onclick="modal.close()">Cancel</button><button class="primary" id="save">Create employee</button></div><div id="formmsg" class="muted"></div></div></dialog><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let data=[],deps=[];const list=document.getElementById('list'),modal=document.getElementById('modal');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function draw(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;let rows=data.filter(x=>(!s||x.employment_status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(x=>`<div class="employee"><div class="avatar">${esc((x.first_name?.[0]||'')+(x.last_name?.[0]||''))}</div><div><div class="name">${esc([x.first_name,x.last_name].filter(Boolean).join(' '))}</div><div class="meta">${esc(x.employee_number)} · ${esc(x.job_title||'No title')} · ${esc(x.department_name||'Unassigned')}</div><div class="meta">${esc(x.work_email||'')}</div></div><span class="badge">${esc(x.employment_status||'unknown')}</span></div>`).join(''):'<div class="empty">No employees found.</div>';document.getElementById('total').textContent=data.length;document.getElementById('active').textContent=data.filter(x=>x.employment_status==='active').length}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})}});if(r.status===401){sessionStorage.clear();location.href='/';throw 0}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Request failed');return j}async function load(){try{let [e,d]=await Promise.all([api('/api/v1/employees?limit=200'),api('/api/v1/departments')]);data=e.results||[];deps=d.results||[];document.getElementById('departments').textContent=deps.length;document.getElementById('dept').innerHTML='<option value="">No department</option>'+deps.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');draw()}catch(e){list.innerHTML='<div class="empty">'+esc(e.message||'Directory unavailable')+'</div>'}}document.getElementById('q').oninput=draw;document.getElementById('status').onchange=draw;document.getElementById('refresh').onclick=load;document.getElementById('add').onclick=()=>{document.getElementById('hire').value=new Date().toISOString().slice(0,10);modal.showModal()};document.getElementById('save').onclick=async()=>{let msg=document.getElementById('formmsg');msg.textContent='Saving…';try{await api('/api/v1/employees',{method:'POST',body:JSON.stringify({employee_number:num.value,first_name:first.value,last_name:last.value,work_email:email.value||null,hire_date:hire.value,job_title:title.value||null,department_id:dept.value||null,role_name:role.value})});msg.textContent='Employee created.';setTimeout(()=>modal.close(),350);load()}catch(e){msg.textContent=e.message}};load();</script></body></html>
