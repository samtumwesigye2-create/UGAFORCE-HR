<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR People</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{padding:22px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e1e6ea;border-radius:14px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:11px;border:1px solid #d5dde4;border-radius:9px;background:#fff}button{cursor:pointer}.primary{background:#172936;color:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#687684}.muted{color:#697784;font-size:13px}@media(max-width:600px){main{padding:16px}.top{align-items:flex-start;flex-direction:column;gap:10px}}</style></head><body><main><div class="top"><div><h1>People Management</h1><div class="muted">Employee directory and workforce records</div></div><button onclick="location.href='/'">Command Center</button></div><div class="card"><div class="toolbar"><input id="q" placeholder="Search employees"><button class="primary" id="refresh">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>ID</th><th>Department</th><th>Title</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';let data=[];const rows=document.getElementById('rows');function draw(){const q=document.getElementById('q').value.toLowerCase();const list=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));rows.innerHTML=list.length?list.map(x=>`<tr><td>${x.display_name||x.full_name||x.name||[x.first_name,x.last_name].filter(Boolean).join(' ')||'—'}</td><td>${x.employee_number||x.employee_id||x.id||'—'}</td><td>${x.department_name||x.department||'—'}</td><td>${x.job_title||x.title||'—'}</td><td>${x.employment_status||x.status||'—'}</td></tr>`).join(''):'<tr><td colspan="5">No employees found.</td></tr>'}async function load(){for(const url of ['/api/v1/people','/api/v1/employees']){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';return}if(!r.ok)continue;const j=await r.json();data=Array.isArray(j)?j:(j.items||j.employees||j.people||[]);draw();return}catch(e){}}rows.innerHTML='<tr><td colspan="5">Employee directory unavailable.</td></tr>'}document.getElementById('q').oninput=draw;document.getElementById('refresh').onclick=load;load();</script></body></html>
