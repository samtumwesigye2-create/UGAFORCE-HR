<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Offboarding</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px;margin-top:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button,input,textarea,select{font:inherit}button{height:40px;padding:0 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d5dde4;border-radius:9px;background:#fff}@media(max-width:700px){.form{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>Offboarding & Notifications</h1><div>Employee exits, clearance workflow and HR communications</div></div><button onclick="location.href='/'">Command Center</button></div><div class="card"><h2>Offboarding Cases</h2><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Last Working Day</th><th>Reason</th><th>Status</th><th>Started</th><th>Completed</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>Start Offboarding</h2><div class="form"><input id="emp" placeholder="Employee ID"><input id="last" type="date"><textarea id="reason" class="full" placeholder="Reason"></textarea><button onclick="startExit()">Start Offboarding</button></div></div><div class="card"><h2>Send HR Notification</h2><div class="form"><input id="nemp" placeholder="Employee ID"><select id="channel"><option value="in_app">In-app</option><option value="email">Email</option></select><input id="subject" class="full" placeholder="Subject"><textarea id="body" class="full" placeholder="Message"></textarea><button onclick="sendNotice()">Queue Notification</button></div><div id="msg"></div></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function call(u,o={}){const r=await fetch('/api/v1'+u,{...o,headers:{...H,...(o.headers||{})}});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||'Request failed')}return r.json()}async function load(){try{const d=await call('/offboarding');rows.innerHTML=(d.results||[]).map(x=>`<tr><td>${x.employee_number||''} ${x.first_name||''} ${x.last_name||''}</td><td>${x.last_working_date||'—'}</td><td>${x.reason||'—'}</td><td>${x.status||''}</td><td>${x.started_at?new Date(x.started_at).toLocaleString():'—'}</td><td>${x.completed_at?new Date(x.completed_at).toLocaleString():'—'}</td></tr>`).join('')||'<tr><td colspan="6">No offboarding cases</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="6">Offboarding data unavailable</td></tr>'}}async function startExit(){try{await call('/offboarding',{method:'POST',body:JSON.stringify({employee_id:emp.value,last_working_date:last.value,reason:reason.value})});msg.textContent='Offboarding started';await load()}catch(e){msg.textContent=e.message}}async function sendNotice(){try{await call('/notifications',{method:'POST',body:JSON.stringify({employee_id:nemp.value,subject:subject.value,body:body.value,channel:channel.value})});msg.textContent='Notification queued'}catch(e){msg.textContent=e.message}}load()</script></body></html>
