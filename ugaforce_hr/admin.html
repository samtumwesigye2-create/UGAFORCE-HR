<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Administration</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:11px;color:#697784;text-transform:uppercase}.v{font-size:25px;font-weight:800;margin-top:7px}.ok{color:#137333}.bad{color:#b3261e}button{height:40px;padding:0 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff}.note{margin-top:14px;color:#66727d}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>Administration & Security</h1><div>Production configuration and security readiness</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Overall Readiness</div><div class="v" id="ready">—</div></div><div class="card"><div class="k">Database</div><div class="v" id="db">—</div></div><div class="card"><div class="k">CORS</div><div class="v" id="cors">—</div></div><div class="card"><div class="k">Bootstrap Security</div><div class="v" id="boot">—</div></div></div><div class="card"><h2>Integration Readiness</h2><p>UGACORE integration: <strong id="core">—</strong></p><p class="note" id="note"></p></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={Authorization:'Bearer '+token};function set(id,x){const e=document.getElementById(id);e.textContent=x?'Ready':'Attention';e.className='v '+(x?'ok':'bad')}async function load(){const r=await fetch('/api/v1/security/readiness',{headers:H});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';return}if(r.status===403){ready.textContent='Admin only';return}if(!r.ok){ready.textContent='Unavailable';return}const x=await r.json(),c=x.checks||{};set('ready',x.ready);set('db',c.database_configured);set('cors',c.cors_configured);set('boot',c.bootstrap_key_configured);core.textContent=c.ugacore_configured?'Configured':'Not configured';note.textContent=x.note||''}load()</script></body></html>
