<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Performance</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:11px;color:#697784;text-transform:uppercase}.v{font-size:29px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button{height:40px;padding:0 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}</style></head><body><main><div class="top"><div><h1>Performance Management</h1><div>Goals, review cycles, ratings and talent decisions</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Active Cycles</div><div class="v" id="c">—</div></div><div class="card"><div class="k">Reviews Pending</div><div class="v" id="r">—</div></div><div class="card"><div class="k">Active Goals</div><div class="v" id="g">—</div></div><div class="card"><div class="k">Talent Recommendations</div><div class="v" id="t">—</div></div></div><div class="card tablewrap"><h2>Performance Reviews</h2><table><thead><tr><th>Employee</th><th>Cycle</th><th>Self</th><th>Manager</th><th>Calibrated</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={Authorization:'Bearer '+token};async function get(u){const x=await fetch('/api/v1'+u,{headers:H});if(x.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}if(!x.ok)throw Error();return x.json()}async function load(){try{const m=await get('/performance/metrics');c.textContent=m.active_cycles;r.textContent=m.reviews_pending;g.textContent=m.active_goals;t.textContent=m.talent_recommendations;const q=await get('/performance/reviews');rows.innerHTML=(q.results||[]).map(x=>`<tr><td>${x.employee_number||''} ${x.first_name||''} ${x.last_name||''}</td><td>${x.cycle||'—'}</td><td>${x.self_rating??'—'}</td><td>${x.manager_rating??'—'}</td><td>${x.calibrated_rating??'—'}</td><td>${x.status||''}</td></tr>`).join('')||'<tr><td colspan="6">No performance reviews</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="6">Performance data unavailable</td></tr>'}}load()</script></body></html>
