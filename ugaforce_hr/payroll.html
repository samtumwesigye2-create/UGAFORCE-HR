<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Payroll</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:12px;color:#697784;text-transform:uppercase}.v{font-size:28px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button{padding:10px 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff}.warn{font-size:12px;color:#9a5c00}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.v{font-size:24px}}</style></head><body><main><div class="top"><div><h1>Payroll & Benefits</h1><div>Payroll runs, approvals, gross/net totals and benefits enrollment</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Open Runs</div><div class="v" id="o">—</div></div><div class="card"><div class="k">Pending Approval</div><div class="v" id="p">—</div></div><div class="card"><div class="k">YTD Gross</div><div class="v" id="g">—</div></div><div class="card"><div class="k">Benefit Enrollments</div><div class="v" id="b">—</div></div></div><div class="card tablewrap"><h2>Payroll Runs</h2><div class="warn" id="w"></div><table><thead><tr><th>Pay Group</th><th>Period</th><th>Pay Date</th><th>Employees</th><th>Gross</th><th>Net</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const t=sessionStorage.getItem('ugaforce-hr-token');if(!t)location.href='/';const H={Authorization:'Bearer '+t};const money=v=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(v||0));async function get(u){const r=await fetch('/api/v1'+u,{headers:H});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}if(!r.ok)throw Error('Request failed');return r.json()}async function load(){try{const m=await get('/payroll/metrics');o.textContent=m.open_runs;p.textContent=m.pending_approval;g.textContent=money(m.ytd_gross);b.textContent=m.active_benefit_enrollments;w.textContent=m.runs_with_warnings?`${m.runs_with_warnings} draft payroll run(s) have calculation warnings.`:'';const x=await get('/payroll/runs');rows.innerHTML=(x.results||[]).map(v=>`<tr><td>${v.pay_group||'—'}</td><td>${v.period_start||''} → ${v.period_end||''}</td><td>${v.pay_date||'—'}</td><td>${v.employee_count||0}</td><td>${money(v.total_gross)}</td><td>${money(v.total_net)}</td><td>${v.status||''}</td></tr>`).join('')||'<tr><td colspan="7">No payroll runs</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="7">Payroll data unavailable for this account</td></tr>'}}load()</script></body></html>
