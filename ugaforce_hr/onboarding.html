<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Onboarding</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #e0e6ea;border-radius:14px;padding:17px}.k{font-size:12px;color:#697784;text-transform:uppercase}.v{font-size:30px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{font-size:11px;color:#697784;text-transform:uppercase}button{padding:10px 13px;border:1px solid #d5dde4;border-radius:9px;background:white}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.v{font-size:25px}}</style></head><body><main><div class="top"><div><h1>Onboarding Operations</h1><div>New-hire readiness, tasks, documents and provisioning</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Active Cases</div><div class="v" id="a">—</div></div><div class="card"><div class="k">Overdue Tasks</div><div class="v" id="o">—</div></div><div class="card"><div class="k">Documents Waiting</div><div class="v" id="d">—</div></div><div class="card"><div class="k">Provisioning Open</div><div class="v" id="p">—</div></div></div><div class="card tablewrap"><h2>Onboarding Cases</h2><table><thead><tr><th>Employee</th><th>Role</th><th>Department</th><th>Hire Date</th><th>Progress</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const t=sessionStorage.getItem('ugaforce-hr-token');if(!t)location.href='/';const H={Authorization:'Bearer '+t};async function get(u){const r=await fetch('/api/v1'+u,{headers:H});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw 0}if(!r.ok)throw Error('Request failed');return r.json()}async function load(){try{const m=await get('/onboarding/metrics');a.textContent=m.active_cases;o.textContent=m.overdue_tasks;d.textContent=m.documents_waiting;p.textContent=m.provisioning_open;const x=await get('/onboarding/cases');rows.innerHTML=(x.results||[]).map(v=>`<tr><td>${v.employee_number||''} ${v.first_name||''} ${v.last_name||''}</td><td>${v.job_title||'—'}</td><td>${v.department_name||'—'}</td><td>${v.hire_date||'—'}</td><td>${v.completed_tasks||0}/${v.task_count||0}</td><td>${v.status||''}</td></tr>`).join('')||'<tr><td colspan="6">No onboarding cases</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="6">Onboarding data unavailable</td></tr>'}}load()</script></body></html>
