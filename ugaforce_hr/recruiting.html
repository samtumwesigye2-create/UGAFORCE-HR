<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAFORCE-HR Recruiting</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{padding:22px;max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#697784;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{background:#fff;border:1px solid #e1e6ea;border-radius:14px;padding:18px}.k{font-size:11px;text-transform:uppercase;color:#687684}.v{font-size:28px;font-weight:750;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button,.top button{padding:10px 13px;border:1px solid #d5dde4;border-radius:9px;background:#fff;cursor:pointer}.tabs button.active{background:#172936;color:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f2;white-space:nowrap;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#687684}.hidden{display:none}@media(max-width:760px){main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>Recruiting & Talent Acquisition</h1><div class="muted">Requisitions, job postings, candidates and offers</div></div><button onclick="location.href='/'">Command Center</button></div><div class="grid"><div class="card"><div class="k">Open Jobs</div><div class="v" id="openJobs">—</div></div><div class="card"><div class="k">Active Candidates</div><div class="v" id="activeCandidates">—</div></div><div class="card"><div class="k">Scheduled Interviews</div><div class="v" id="scheduledInterviews">—</div></div><div class="card"><div class="k">Open Offers</div><div class="v" id="openOffers">—</div></div></div><div class="tabs"><button class="active" data-tab="applications">Applications</button><button data-tab="requisitions">Requisitions</button><button data-tab="postings">Job Postings</button></div><section id="applications" class="card tablewrap"><table class="table"><thead><tr><th>Candidate</th><th>Job</th><th>Stage</th><th>Status</th><th>Source</th><th>Applied</th></tr></thead><tbody id="applicationRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></section><section id="requisitions" class="card tablewrap hidden"><table class="table"><thead><tr><th>Title</th><th>Department</th><th>Hiring Manager</th><th>Headcount</th><th>Type</th><th>Status</th></tr></thead><tbody id="requisitionRows"></tbody></table></section><section id="postings" class="card tablewrap hidden"><table class="table"><thead><tr><th>Title</th><th>Department</th><th>Location</th><th>Remote Policy</th><th>Status</th><th>Published</th></tr></thead><tbody id="postingRows"></tbody></table></section></main><script>const token=sessionStorage.getItem('ugaforce-hr-token');if(!token)location.href='/';const H={Authorization:'Bearer '+token};async function req(path){const r=await fetch('/api/v1/recruiting'+path,{headers:H});if(r.status===401){sessionStorage.removeItem('ugaforce-hr-token');location.href='/';throw new Error('Session expired')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}function td(v){return v??'—'}async function load(){try{const m=await req('/metrics');openJobs.textContent=m.open_jobs;activeCandidates.textContent=m.active_candidates;scheduledInterviews.textContent=m.scheduled_interviews;openOffers.textContent=m.open_offers;const a=await req('/applications');applicationRows.innerHTML=a.results.map(x=>`<tr><td>${td((x.first_name||'')+' '+(x.last_name||''))}</td><td>${td(x.job_title)}</td><td>${td(x.stage_name)}</td><td>${td(x.status)}</td><td>${td(x.source)}</td><td>${x.applied_at?new Date(x.applied_at).toLocaleDateString():'—'}</td></tr>`).join('')||'<tr><td colspan="6">No applications found</td></tr>';const r=await req('/requisitions');requisitionRows.innerHTML=r.results.map(x=>`<tr><td>${td(x.title)}</td><td>${td(x.department_name)}</td><td>${td(x.hiring_manager)}</td><td>${td(x.headcount)}</td><td>${td(x.employment_type)}</td><td>${td(x.status)}</td></tr>`).join('')||'<tr><td colspan="6">No requisitions found</td></tr>';const p=await req('/postings');postingRows.innerHTML=p.results.map(x=>`<tr><td>${td(x.title)}</td><td>${td(x.department_name)}</td><td>${td(x.location)}</td><td>${td(x.remote_policy)}</td><td>${td(x.status)}</td><td>${x.published_at?new Date(x.published_at).toLocaleDateString():'—'}</td></tr>`).join('')||'<tr><td colspan="6">No job postings found</td></tr>'}catch(e){applicationRows.innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['applications','requisitions','postings'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab))});load();</script></body></html>
